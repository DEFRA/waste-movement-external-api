# waste-tracking-external-api's changes to the shared stack (see compose.yml)

services:
  waste-tracking-external-api:
    # A local name, so the build doesn't replace your pulled published image
    image: waste-tracking-external-api:local
    # Paths here resolve against the shared file's folder, so use where compose
    # is run from: this repo's root
    build:
      context: ${PWD}
      target: development
    volumes:
      - ${PWD}/src:/home/node/src:Z
      - ${PWD}/package.json:/home/node/package.json:Z
