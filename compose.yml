# The full stack, shared with the other service repos (see shared-compose/README.md
# in digital-waste-tracking-uat), with waste-tracking-external-api built from this repo by
# compose.override-shared.yml.
#
# Set SHARED_COMPOSE to a local checkout's shared-compose/compose.yml to try
# changes to the shared stack. Add a compose.override.yml for your own tweaks.

include:
  # The override goes in this list, as older Compose versions (such as v2.38 on
  # GitHub's runners) reject redefining an included service
  - path:
      - ${SHARED_COMPOSE:-https://github.com/DEFRA/digital-waste-tracking-uat.git#main:shared-compose/compose.yml}
      - compose.override-shared.yml
